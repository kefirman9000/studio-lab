<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="/favicon.ico" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Lab</title>
<style>
:root{
  --bg:#0d0f14; --panel:#151821; --panel2:#1b1f2b; --line:#262b3a; --text:#e7e9ef; --muted:#8a90a2;
  --acc:#7c5cff; --acc2:#29d3b2; --warn:#ffb547; --bad:#ff5d6c; --chip:#212637; --chipon:#2d2457;
  --r:12px; --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 var(--font)}
button,input,select{font:inherit;color:inherit}
a{color:var(--acc2)}
.app{display:grid;grid-template-rows:56px 1fr;height:100vh}
header{display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#121521,#0d0f14)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.3px;font-size:16px}
.logo .mark{width:26px;height:26px;border-radius:7px;background:conic-gradient(from 210deg,var(--acc),var(--acc2),#ff6fb1,var(--acc));box-shadow:0 0 18px #7c5cff55}
.ver{color:var(--muted);font-size:12px;font-family:var(--mono)}
header .sp{flex:1}
.hbtn{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 11px;cursor:pointer;font-size:13px}
.hbtn:hover{border-color:#3a4157}
.badge{background:var(--acc);color:#fff;border-radius:99px;padding:2px 8px;font-size:11px;margin-left:6px}
main{display:grid;grid-template-columns:300px minmax(420px,1fr) 420px;min-height:0}
.col{overflow:auto;min-height:0;padding:16px}
.col.l{border-right:1px solid var(--line);background:#11131b}
.col.r{border-left:1px solid var(--line);background:#11131b}
h3{margin:0 0 10px;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);font-weight:600}
.search{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:10px;outline:none}
.tabs{display:flex;gap:4px;margin-bottom:10px;background:var(--panel2);padding:3px;border-radius:10px}
.tabs button{flex:1;border:0;background:none;padding:6px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:12.5px}
.tabs button.on{background:var(--chipon);color:#fff}
.styles{display:flex;flex-direction:column;gap:4px}
.st{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:9px;cursor:pointer;border:1px solid transparent}
.st:hover{background:var(--panel2)}
.st.on{background:var(--chipon);border-color:#4a3d8f}
.st .nm{flex:1}
.st .bpm{font-family:var(--mono);font-size:11px;color:var(--muted)}
.st .ck{width:18px;height:18px;border-radius:5px;border:1.5px solid #4a5270;display:flex;align-items:center;justify-content:center;flex:none;font-size:12px;color:#fff;cursor:pointer}
.st .ck:hover{border-color:var(--acc2)}
.st.in .ck{background:var(--acc2);border-color:var(--acc2);color:#04241d}
.st.on .ck{background:var(--acc);border-color:var(--acc);color:#fff}
.st .lead{font-size:10px;color:#ffd66b;margin-left:4px}
.mix{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mix .chip{display:flex;align-items:center;gap:6px}
.mix .chip .x{color:var(--muted);cursor:pointer}
.mix .chip .x:hover{color:#ff7d8a}
.tabs button .cnt{background:var(--acc2);color:#04241d;border-radius:99px;font-size:10px;padding:0 5px;margin-left:4px}
.sel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:14px}
.sel .t{font-weight:650;font-size:15px}
.sel .d{color:var(--muted);font-size:12.5px;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--chip);border:1px solid var(--line);border-radius:99px;padding:4px 10px;cursor:pointer;font-size:12.5px;user-select:none}
.chip.on{background:var(--chipon);border-color:#5a49b8;color:#fff}
.chip.x::after{content:" ×";color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px}
.card>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:8px;font-weight:600}
.card>summary::-webkit-details-marker{display:none}
.card>summary::after{content:"▾";margin-left:auto;color:var(--muted);transition:.2s}
.card:not([open])>summary::after{transform:rotate(-90deg)}
.card .body{padding:2px 14px 14px;display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.wide{grid-column:1/-1}
.f label{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.f label b{color:var(--text);font-weight:500;font-family:var(--mono);font-size:11.5px}
select,input[type=number],input[type=text]{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 8px;outline:none;width:100%}
input[type=range]{width:100%;accent-color:var(--acc)}
.knob{width:46px;height:46px;cursor:ns-resize;touch-action:none;outline:none;flex:none;user-select:none}
.knob svg{width:100%;height:100%;display:block}
.knob .kbg{fill:var(--panel2);stroke:var(--line);stroke-width:1.5}
.knob .karc{fill:none;stroke:var(--line);stroke-width:3.5;stroke-linecap:round}
.knob .kval{fill:none;stroke:var(--acc);stroke-width:3.5;stroke-linecap:round}
.knob .kptr{stroke:var(--text);stroke-width:2.5;stroke-linecap:round}
.knob.off{opacity:.35;cursor:default}
.knob:focus-visible .kbg{stroke:var(--acc)}
.knob:hover .kbg{fill:var(--line)}
input.knobbed{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.lv{display:inline-flex;flex-direction:column;align-items:center;gap:2px;margin-right:10px}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{flex:1;border:0;background:none;padding:5px 4px;border-radius:7px;cursor:pointer;font-size:12.5px;color:var(--muted)}
.seg button.on{background:var(--chipon);color:#fff}
.row{display:flex;gap:6px;align-items:center}
.ibtn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 9px;cursor:pointer}
.auto{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px;cursor:pointer}
.layers{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;grid-column:1/-1}
.layers .chip{text-align:center}
.bar{position:sticky;bottom:0;background:linear-gradient(0deg,var(--bg) 70%,transparent);padding:14px 0 4px;margin-top:6px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:11px;padding:11px 16px;font-weight:650;cursor:pointer;display:flex;align-items:center;gap:7px}
.btn.p{background:linear-gradient(135deg,var(--acc),#5a3fe0);color:#fff;box-shadow:0 6px 22px #7c5cff44}
.btn.s{background:var(--panel2);border:1px solid var(--line)}
.btn.g{background:linear-gradient(135deg,#1fb998,var(--acc2));color:#04241d}
.btn:disabled{opacity:.5;cursor:default}
.outs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.prog{height:4px;background:var(--panel2);border-radius:9px;overflow:hidden;margin:10px 0 4px;display:none}
.prog>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .3s}
.status{font-size:12px;color:var(--muted);font-family:var(--mono);min-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px}
.res.new{animation:pop .5s ease}
@keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
.res .top{display:flex;align-items:center;gap:10px}
.play{width:40px;height:40px;border-radius:50%;border:0;background:var(--acc);color:#fff;cursor:pointer;font-size:15px;flex:none;box-shadow:0 4px 14px #7c5cff55}
.res .tt{font-weight:650}
.res .mt{font-size:12px;color:var(--muted);font-family:var(--mono)}
canvas.wave{width:100%;height:46px;display:block;margin:10px 0 6px;cursor:pointer;border-radius:6px;background:#0f121a}
.res .info{font-size:12px;color:var(--muted);line-height:1.6}
.res .info span{color:var(--text)}
.rr{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;align-items:center}
.rr .lbl{font-size:11px;color:var(--muted);margin-right:2px}
.mini{background:var(--chip);border:1px solid var(--line);border-radius:7px;padding:3px 8px;font-size:12px;cursor:pointer}
.mini:hover{border-color:#4a5270}
.mini.acc{background:var(--chipon);border-color:#5a49b8}
.files{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.files a{font-size:12px;text-decoration:none;background:#10261f;border:1px solid #1d4a3c;border-radius:7px;padding:3px 8px}
.empty{color:var(--muted);text-align:center;padding:40px 10px;border:1px dashed var(--line);border-radius:var(--r)}
.empty .big{font-size:28px;margin-bottom:8px}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:9}
.modal.on{display:flex}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;width:min(520px,92vw);max-height:80vh;overflow:auto}
.modal pre{white-space:pre-wrap;font-family:var(--mono);font-size:12px;color:var(--muted)}
.rtabs{display:flex;gap:4px;margin-bottom:12px}
.hint{font-size:11.5px;color:var(--muted)}
.modal .box.wide{width:min(860px,95vw)}
.pp{display:inline-flex;align-items:center;gap:1px;margin-right:6px;font-size:12px;color:var(--muted,#9aa)}
.ico{background:none;border:0;cursor:pointer;opacity:.45;font-size:12px;padding:0 2px}.ico.on,.ico:hover{opacity:1}.ico.on[data-lv]{color:#ff6b8a}
.res.ab{outline:2px solid #7c6cff}.abbar,.locks{gap:6px;align-items:center;margin-bottom:8px}.abbar .btn.p{outline:2px solid #fff3}
.locks a{color:var(--muted,#9aa);text-decoration:none}
.fxsel{margin-top:4px;font-size:12px;opacity:.85}
.levels{display:grid;grid-template-columns:repeat(6,1fr);gap:6px 12px}.levels .lv{font-size:12px;color:var(--mut,#9aa)}.levels .lv b{float:right;font-weight:600}.levels input{width:100%}
.pl{display:grid;grid-template-columns:22px 1fr auto;gap:4px 10px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--line)}
.pl:hover{background:var(--panel2)}
.pl .n{font-weight:600}.pl .m{font-size:11.5px;color:var(--muted)}
.tag{font-size:10.5px;border-radius:6px;padding:1px 6px;border:1px solid var(--line);margin-left:4px;font-family:var(--mono)}
.tag.free{background:#10261f;border-color:#1d4a3c;color:#5fe0b8}.tag.paid{background:#2a2213;border-color:#57451f;color:#ffc66b}
.res .tags{margin-top:4px;display:flex;flex-wrap:wrap;gap:4px}.res .tags .tag{margin-left:0;color:var(--muted)}
.tag.ok{color:#5fe0b8}.tag.no{color:#ff7d8a;border-color:#5a2730}.tag.inst{background:#1d2440;color:#9bb0ff}
.tl{display:flex;gap:2px;margin:10px 0 2px;height:30px}
.tl .blk{position:relative;border-radius:5px;background:#252a3d;cursor:pointer;font-size:10.5px;color:#c9cde0;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;min-width:14px;border:1px solid transparent}
.tl .blk:hover{background:#2f3550}.tl .blk.sel{border-color:var(--acc);background:#2d2457}
.tl .blk.drop{background:#3a2a5c}.tl .blk.build{background:#2a3349}.tl .blk.edited::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--acc2)}
.sed{background:#11141e;border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:6px}
.sed .row{flex-wrap:wrap;margin-bottom:6px}
.sed audio{width:100%;height:32px;margin-top:6px}
.drag{cursor:grab;background:#1d2440;border:1px solid #33407a;color:#b9c6ff;border-radius:7px;padding:3px 8px;font-size:12px;text-decoration:none}
.rate{background:none;border:1px solid var(--line);border-radius:7px;padding:2px 7px;cursor:pointer;font-size:13px}
.rate.on{background:var(--chipon);border-color:#5a49b8}
.plugrec{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.7}.plugrec a{text-decoration:none}
.blend{margin-top:12px}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:#262b3a;border-radius:9px;border:3px solid transparent;background-clip:content-box}
@media (max-width:1200px){main{grid-template-columns:270px 1fr}.col.r{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="logo"><div class="mark"></div>Studio Lab</div>
  <div class="ver" id="ver"></div>
  <div class="sp"></div>
  <button class="hbtn" id="libBtn" title="Real recorded instruments for orchestral & acoustic styles">🎻 Real instruments</button>
  <button class="hbtn" id="rigBtn" title="Auto-download free instruments and play each genre through the plugins that define its sound">🎚 Genre VSTs</button>
  <button class="hbtn" id="vstBtn" title="Play parts with your own VST3 / AU instruments (experimental)">🎹 VST</button>
  <button class="hbtn" id="soundsBtn" title="Use your own drum samples and sounds">🎛 My sounds</button>
  <button class="hbtn" id="plugBtn" title="Tell Studio Lab which plugins you have">🔌 My plugins</button>
  <button class="hbtn" id="presetBtn" title="Save or load your favourite settings">★ Presets</button>
  <button class="hbtn" id="folderBtn" title="Open the output folder">📁 Output</button>
  <button class="hbtn" id="updBtn">⟳ Updates<span class="badge" id="updBadge" style="display:none">new</span></button>
</header>
<main>
  <!-- LEFT: styles -->
  <div class="col l">
    <div class="sel" id="selCard"><div class="t" id="selName">—</div><div class="d" id="selDesc"></div>
      <div class="mix" id="mixChips"></div>
      <div class="hint" style="margin-top:8px" id="mixHint"></div>
    </div>
    <h3>Styles</h3>
    <input class="search" id="search" placeholder="Search styles…">
    <div class="tabs" id="catTabs"></div>
    <div class="hint" style="margin:-4px 0 8px">Click a name to pick it • tick boxes to <b>blend</b> styles (up to 4)</div>
    <div class="styles" id="styleList"></div>
    <h3 style="margin-top:18px">Mood</h3>
    <div class="chips" id="moods"></div>
  </div>

  <!-- CENTER: controls -->
  <div class="col c">
    <details class="card" open><summary>Basics</summary><div class="body">
      <div class="f"><label>Tempo <span class="auto"><input type="checkbox" id="bpmAuto" checked>auto</span></label>
        <div class="row"><input type="range" id="bpm" min="55" max="200" value="120" disabled><b id="bpmV" style="min-width:34px;font-family:var(--mono);font-size:12px">auto</b></div></div>
      <div class="f"><label>Seed <span class="hint">same seed = same song</span></label>
        <div class="row"><input type="number" id="seed" min="1" value="1"><button class="ibtn" id="dice" title="Random seed">🎲</button><label class="auto" title="Keep this seed: pressing Preview again re-renders the same song (handy while you tweak settings)"><input type="checkbox" id="seedLock">🔒</label></div></div>
      <div class="f"><label>Key</label><select id="key"></select></div>
      <div class="f"><label>Scale</label><select id="scale"></select></div>
      <div class="f"><label>Length</label><div class="seg" id="length"></div></div>
      <div class="f"><label>Structure</label><div class="seg" id="structure"></div></div>
      <div class="f wide"><label>Reference track <span class="hint">match tempo, key, loudness &amp; brightness of a song you like</span></label>
        <div class="row"><button class="ibtn" id="refBtn" title="An audio file, a MIDI file, MusicXML (MuseScore, Sibelius, Dorico...) or Studio Lab settings">🎯 Match a reference…</button><input type="file" id="refFile" accept="audio/*,.mid,.midi,.kar,.musicxml,.xml,.mxl,.json" hidden><span class="hint" id="refRes"></span></div></div>
      <div class="f wide"><label>Chord progression <span class="hint">optional • e.g. i-VI-III-VII or 1-5-6-4</span></label><input type="text" id="prog" placeholder="auto"></div>
    </div></details>

    <details class="card" open><summary>Feel</summary><div class="body">
      <div class="f"><label>Energy <b id="energyV"></b></label><input type="range" id="energy" min="0" max="100" value="50"></div>
      <div class="f"><label>Complexity <b id="complexityV"></b></label><input type="range" id="complexity" min="0" max="100" value="50"></div>
      <div class="f"><label title="Strip it back: plain triads, fewer and longer notes, held chords, no counter-melody or doubling, fewer fills">Simplicity <b id="simplicityV"></b></label><input type="range" id="simplicity" min="0" max="100" value="0"></div>
      <div class="f"><label title="How much the melody repeats its opening idea: high = catchy loop, low = keeps developing">Repetition <b id="repetitionV"></b></label><input type="range" id="repetition" min="0" max="100" value="50"></div>
      <div class="f"><label title="Narrow = a few notes, chant-like · wide = big leaps">Melody range <b id="mrangeV"></b></label><input type="range" id="mrange" min="0" max="100" value="50"></div>
      <div class="f"><label>Chord speed</label><select id="chordSpeed"><option value="">Style default</option><option value="slow">Slow (chords last twice as long)</option><option value="fast">Fast (change twice as often)</option></select></div>
      <div class="f"><label>Swing <span class="auto"><input type="checkbox" id="swingAuto" checked>style</span></label><input type="range" id="swing" min="50" max="75" value="55" disabled></div>
      <div class="f"><label>Humanize <b id="humanizeV"></b></label><input type="range" id="humanize" min="0" max="200" value="100"></div>
      <div class="f wide"><label>Variety <span class="hint">how much each song re-imagines its style: instruments, tones, grooves, arrangement</span><b id="varietyV"></b></label><input type="range" id="variety" min="0" max="100" value="55"></div>
      <div class="f"><label>Groove feel <span class="hint">timing of each part</span></label><select id="groove"><option value="">Genre feel</option><option value="straight">Straight (on the grid)</option><option value="dilla">Lazy hip-hop (J Dilla)</option><option value="laidback">Laid back (reggae)</option><option value="afro">Afro swing</option><option value="dembow">Dembow push</option><option value="jazz">Jazz (ride on top)</option><option value="house">House (late hats)</option><option value="funk">Funk (pushed 16ths)</option></select></div>
      <div class="f"><label>Lead style <span class="hint">how the lead line is built</span></label><select id="leadStyle"><option value="">Genre default</option><option value="hook">Hook (sung-style melody)</option><option value="arp">Arpeggio (trance, synthwave)</option><option value="riff">Riff (rock, funk)</option><option value="ostinato">Ostinato (techno)</option><option value="bell">Bell motif (trap)</option><option value="call">Call &amp; response (afro, reggae)</option><option value="chops">Vocal-chop stabs (house, garage)</option></select></div>
      <div class="f"><label title="Verses, choruses and breaks play parts on different instruments from the genre's own pool">Instrument rotation</label><select id="rotation"><option value="auto">Auto (with Variety)</option><option value="off">Off - one instrument per part</option><option value="some">Some - one part changes</option><option value="lots">Lots - several parts change</option></select></div>
      <div class="f"><label>Build-ups</label><select id="buildStyle"><option value="">Genre default</option><option value="roll">Snare roll + riser (trance, big room)</option><option value="filter">Filter sweep, kick out (house, techno)</option><option value="triplet">Triplet roll (future bass)</option><option value="kick_roll">Kick roll (hardstyle)</option><option value="stutter">Stutter + silence (dubstep)</option><option value="pause">Drop-out (amapiano, garage)</option><option value="lift">Snare lift (pop, rock)</option><option value="swell">Swell (film)</option></select></div>
      <div class="f"><label>Bass rhythm</label><select id="bassRhythm"><option value="">Style's bassline</option><option value="kick">Follow the kick drum</option></select></div>
      <div class="f"><label>Ending</label><select id="ending"><option value="auto">Genre default</option><option value="hit">Final chord + crash</option><option value="fade">Fade out</option></select></div>
      <div class="f"><label>Counter-melody <span class="hint">a second line answering the lead</span></label><select id="counter"><option value="">Genre decides</option><option value="on">Always</option><option value="off">Never</option></select></div>
      <div class="f"><label>Layered sounds <span class="hint">parts doubled by a second instrument</span></label><select id="layering"><option value="">Genre &amp; variety decide</option><option value="more">More layers</option><option value="off">Off (one instrument per part)</option></select></div>
      <div class="f"><label>Vocal guide <span class="hint">a singable melody - always in MIDI exports</span></label><label class="auto" style="margin-top:6px"><input type="checkbox" id="vocalGuide"> hear it in the song</label></div>
    </div></details>

    <details class="card" open><summary>Sound</summary><div class="body" id="soundBody">
      <div class="f"><label>Drum kit <span class="auto"><input type="checkbox" id="userDrums">my samples</span></label><select id="kit"></select></div>
      <div class="f"><label>Brightness <b id="brightnessV"></b></label><input type="range" id="brightness" min="-100" max="100" value="0"></div>
      <div class="f"><label>Melody style <span class="hint">how the lead phrases</span></label><select id="melStyle"></select></div>
      <div class="f"><label>Chord voicing</label><select id="voicing"></select></div>
      <div class="f"><label>Chord colour</label><select id="chordColor"></select></div>
    </div></details>

    <details class="card"><summary>Mix &amp; master</summary><div class="body">

<script>

let META=null, state={style:'house', part_fx:{}, blend:[], mood:null, cat:'Electronic', length:1.0, structure:'auto', lofi:null,

function renderSelected(){
  const all=Object.values(META.categories).flat(); const s=all.find(x=>x.id===state.style);
  $('#selName').textContent=state.blend.length?'Blend of '+(state.blend.length+1)+' styles':s.name;

  const mc=$('#mixChips'); mc.innerHTML='';
  [state.style,...state.blend].forEach((id,i)=>{ const c=document.createElement('span'); c.className='chip'+(i===0?' on':'');
    c.innerHTML=`${i===0?'★ ':''}${styleName(id)}${state.blend.length?' <span class="x" title="remove">✕</span>':''}`; c.title=i===0?'Lead style':'Click to make this the lead style';

    const dn=defs[r]?(META.roles[r].find(i=>i.id===defs[r])||{name:defs[r]}).name:'none';

    w.innerHTML=`<label>${label}</label><select><option value="">${dl}</option>${opts}</select>`+
      (fxs.length?`<select class="fxsel" title="Run this part through one of your effect plugins"><option value="">no effect plugin</option>${fxs.map(f=>`<option ${state.part_fx[r]===f?'selected':''}>${esc(f)}</option>`).join('')}</select>`:'');
    w.querySelector('select').onchange=e=>{ if(e.target.value) state.instruments[r]=e.target.value; else delete state.instruments[r]; };

function renderMoods(){

function refresh(){renderStyles();renderSelected();}

function options(){
  const o={style:state.style, seed:+$('#seed').value||1, blend:state.blend, blend_parts:state.blend_parts, mood:state.mood,
    length:state.length, structure:state.structure, energy:$('#energy').value/100, complexity:$('#complexity').value/100,
    simplicity:$('#simplicity').value/100, repetition:$('#repetition').value/100, melody_range:$('#mrange').value/100,
    humanize:$('#humanize').value/100, variety:$('#variety').value/100, instruments:state.instruments, muted:state.muted, brightness:$('#brightness').value/100,
    reverb:$('#reverb').value/100, delay:$('#delay').value/100, width:$('#width').value/100, bass_boost:+$('#bass').value,
    drive:$('#drive').value/100, lofi:state.lofi};
  if(!$('#bpmAuto').checked) o.bpm=+$('#bpm').value;
  if($('#key').value) o.key=$('#key').value;
  if($('#scale').value) o.scale=$('#scale').value;
  if($('#prog').value.trim()) o.progression=$('#prog').value.trim();
  if(!$('#swingAuto').checked) o.swing=$('#swing').value/100;
  if(!$('#scAuto').checked) o.sidechain=$('#sidechain').value/100;
  if(!$('#loudAuto').checked) o.loudness=+$('#loud').value;
  if($('#kit').value) o.kit=$('#kit').value;
  if($('#userDrums').checked) o.user_drums=true;
  if(Object.keys(state.part_fx).length) o.part_fx=Object.assign({},state.part_fx);
  if(Object.keys(LOCKS).length) o.part_seeds=Object.fromEntries(Object.entries(LOCKS).map(([p,l])=>[p,l.seed]));
  if($('#melStyle').value) o.melody_style=$('#melStyle').value;
  if($('#groove').value) o.groove=$('#groove').value;
  if($('#chordSpeed').value) o.chord_speed=$('#chordSpeed').value;
  if($('#rotation').value!=='auto') o.rotation=$('#rotation').value;
  if($('#leadStyle').value) o.lead_style=$('#leadStyle').value;
  if($('#buildStyle').value) o.build_style=$('#buildStyle').value;
  if($('#bassRhythm').value) o.bass_rhythm=$('#bassRhythm').value;
  if($('#ending').value!=='auto') o.ending=$('#ending').value;
  if($('#counter').value) o.counter=$('#counter').value;
  if($('#layering').value) o.layering=$('#layering').value;
  if($('#vocalGuide').checked) o.vocal_guide=true;
  if($('#voicing').value) o.voicing=$('#voicing').value;
  if($('#chordColor').value) o.chord_color=$('#chordColor').value;
  const lv={}; LEVELS.forEach(([k,n,layers])=>{ const v=+$('#lv_'+k).value; if(v) layers.forEach(l=>lv[l]=v); }); if(Object.keys(lv).length) o.part_levels=lv;
  return o;
}
function applyOptions(o){
  state.style=o.style; state.blend=o.blend||[]; state.blend_parts=o.blend_parts||{}; state.mood=o.mood||null;
  state.part_fx=Object.assign({},o.part_fx||{});
  state.length=o.length||1; state.structure=o.structure||'auto'; state.instruments=o.instruments||{}; state.muted=o.muted||[]; state.lofi=o.lofi??null;
  $('#simplicity').value=(o.simplicity??0)*100; $('#repetition').value=(o.repetition??.5)*100; $('#mrange').value=(o.melody_range??.5)*100; $('#chordSpeed').value=o.chord_speed||''; $('#rotation').value=o.rotation||'auto';
  $('#seed').value=o.seed||1; $('#energy').value=(o.energy??.5)*100; $('#complexity').value=(o.complexity??.5)*100; $('#humanize').value=(o.humanize??1)*100; $('#variety').value=(o.variety??.5)*100;
  $('#brightness').value=(o.brightness||0)*100; $('#reverb').value=(o.reverb??1)*100; $('#delay').value=(o.delay??1)*100; $('#width').value=(o.width??1)*100;
  $('#bass').value=o.bass_boost||0; $('#drive').value=(o.drive||0)*100;

  $('#scAuto').checked=o.sidechain==null; if(o.sidechain!=null)$('#sidechain').value=o.sidechain*100;
  $('#loudAuto').checked=o.loudness==null; if(o.loudness!=null)$('#loud').value=o.loudness; $('#kit').value=o.kit||''; $('#userDrums').checked=!!o.user_drums;
  $('#groove').value=o.groove||''; $('#leadStyle').value=o.lead_style||''; $('#buildStyle').value=o.build_style||''; $('#bassRhythm').value=o.bass_rhythm||''; $('#ending').value=o.ending||'auto'; $('#counter').value=o.counter||''; $('#layering').value=o.layering||''; $('#vocalGuide').checked=!!o.vocal_guide;
  $('#melStyle').value=o.melody_style||''; $('#voicing').value=o.voicing||''; $('#chordColor').value=o.chord_color||'';
  LEVELS.forEach(([k,n,layers])=>{ $('#lv_'+k).value=(o.part_levels||{})[layers[0]]||0; });
  const cat=Object.entries(META.categories).find(([c,l])=>l.some(s=>s.id===o.style)); if(cat) state.cat=cat[0];
  syncAutos(); initSegs(); renderMoods(); renderLayers(); renderTabs(); refresh(); $$('input[type=range]').forEach(e=>e.oninput&&e.oninput());
}
// ------------------------------------------------------------- knobs: every slider becomes a rotary knob
// drag up/down (Shift = fine), scroll wheel or arrow keys to turn; double-click resets. The hidden slider underneath
// keeps its value, events and disabled state, so all the existing settings code works unchanged.
function initKnobs(){
  const VD=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value'), DD=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'disabled');
  $$('input[type=range]').forEach(inp=>{
    if(inp.dataset.knob) return; inp.dataset.knob='1';
    const k=document.createElement('div'); k.className='knob'; k.tabIndex=0; k.setAttribute('role','slider');
    k.innerHTML='<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="15" class="kbg"/><path class="karc"/><path class="kval"/><line class="kptr" x1="24" y1="24" x2="24" y2="12"/></svg>';
    inp.parentNode.insertBefore(k, inp); inp.classList.add('knobbed');
    const min=+inp.min, max=+inp.max, step=+(inp.step||1), def=+inp.defaultValue;
    const ang=v=>-135+270*(v-min)/((max-min)||1);
    const pt=(a,r)=>{const t=(a-90)*Math.PI/180; return [24+r*Math.cos(t),24+r*Math.sin(t)]};
    const arc=(a0,a1,r)=>{ if(a1-a0<0.5) a1=a0+0.5; const [x0,y0]=pt(a0,r),[x1,y1]=pt(a1,r); return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${a1-a0>180?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`; };
    const draw=()=>{ const v=+VD.get.call(inp), a=ang(v), z=(min<0&&max>0)?ang(0):-135;
      k.querySelector('.karc').setAttribute('d',arc(-135,135,20)); k.querySelector('.kval').setAttribute('d',a>=z?arc(z,a,20):arc(a,z,20));
      const [x,y]=pt(a,12); const l=k.querySelector('.kptr'); l.setAttribute('x2',x.toFixed(2)); l.setAttribute('y2',y.toFixed(2));
      k.classList.toggle('off',DD.get.call(inp)); k.setAttribute('aria-valuenow',v); };
    Object.defineProperty(inp,'value',{configurable:true,get(){return VD.get.call(this)},set(v){VD.set.call(this,v);draw()}});
    Object.defineProperty(inp,'disabled',{configurable:true,get(){return DD.get.call(this)},set(v){DD.set.call(this,v);draw()}});
    const set=v=>{ v=Math.min(max,Math.max(min,Math.round(v/step)*step)); v=+v.toFixed(4); if(+inp.value===v) return; inp.value=v;
      inp.dispatchEvent(new Event('input',{bubbles:true})); inp.dispatchEvent(new Event('change',{bubbles:true})); };
    let sy=0, sv=0, drag=false;
    k.addEventListener('pointerdown',e=>{ if(inp.disabled) return; drag=true; sy=e.clientY; sv=+inp.value; k.setPointerCapture(e.pointerId); e.preventDefault(); });
    k.addEventListener('pointermove',e=>{ if(drag) set(sv+(sy-e.clientY)/(e.shiftKey?600:160)*(max-min)); });
    k.addEventListener('pointerup',()=>drag=false); k.addEventListener('pointercancel',()=>drag=false);
    k.addEventListener('wheel',e=>{ if(inp.disabled) return; e.preventDefault(); set(+inp.value+(e.deltaY<0?1:-1)*Math.max(step,(max-min)/40)); },{passive:false});
    k.addEventListener('dblclick',()=>{ if(!inp.disabled) set(def); });
    k.addEventListener('keydown',e=>{ if(inp.disabled) return; const d=Math.max(step,(max-min)/40);
      if(e.key==='ArrowUp'||e.key==='ArrowRight'){ set(+inp.value+d); e.preventDefault(); }
      if(e.key==='ArrowDown'||e.key==='ArrowLeft'){ set(+inp.value-d); e.preventDefault(); } });
    k.title='Drag up/down, scroll or use arrow keys · double-click to reset';
    draw();
  });
}
function syncAutos(){
  [['bpmAuto','bpm'],['swingAuto','swing'],['scAuto','sidechain'],['loudAuto','loud']].forEach(([a,r])=>{$('#'+r).disabled=$('#'+a).checked});
  $('#bpmV').textContent=$('#bpmAuto').checked?'auto':$('#bpm').value;
}

// ------------------------------------------------------------- jobs
let busy=false;
async function run(preview, count, opts, section, onResult, varyPart){
  if(busy) return; busy=true; setBusy(true);
  const o=opts||options();
  const body={options:o, preview, count, outputs:state.outputs.length?state.outputs:['wav']};
  if(varyPart) body.vary_part=varyPart;
  if(section!=null) body.section=section;
  const {job}=await api('/api/generate', body);
  const seen=new Set();
  const poll=async()=>{
    const j=await api('/api/job/'+job);
    $('#prog>i').style.width=Math.round((j.progress||0)*100)+'%';
    const last=(j.log||[]).filter(l=>!l.startsWith('Traceback')).slice(-1)[0]||'';
    $('#status').textContent=(j.status==='queued'?'Queued…':last.trim());
    (j.results||[]).forEach(r=>{ if(!seen.has(r.id)){seen.add(r.id); onResult?onResult(r):addResult(r);} });
    if(j.status==='done'||j.status==='error'){
      busy=false; setBusy(false);
      $('#status').textContent=j.status==='error'?('Error: '+j.error):(section!=null?'Section preview ready.':preview?'Preview ready.':'Full song ready — files are in your output folder.');
      if(!preview) loadLibrary();
      return;
    }
    setTimeout(poll, 400);
  };
  poll();
}
function setBusy(b){['#prevBtn','#varBtn','#fullBtn','#surpriseBtn'].forEach(s=>$(s).disabled=b);$('#prog').style.display=b?'block':'none';if(!b)$('#prog>i').style.width='0'}

function addResult(r, target){
  $('#emptyS')&&($('#emptyS').style.display='none');
  const el=document.createElement('div');el.className='res new'; el.dataset.rid=r.id;
  const url=r.urls.mp3||r.urls.wav;
  const title=styleName(r.style)+(r.preview?'':' — full song');
  const inst=Object.entries(r.instruments||{}).map(([k,v])=>`${k}: <span>${v}</span>`).join(' · ');

let AB=[];
function abPick(r, el){
  if(AB.find(x=>x.r.id===r.id)){ AB=AB.filter(x=>x.r.id!==r.id); } else { AB.push({r,el}); if(AB.length>2) AB.shift(); }
  $$('.res').forEach(x=>x.classList.toggle('ab', !!AB.find(a=>a.el===x)));
  const bar=$('#abBar');
  if(AB.length<2){ bar.style.display=AB.length?'':'none'; bar.innerHTML=AB.length?'<span class="hint">A/B: pick one more result to compare</span>':''; return; }
  const name=x=>`${esc(styleName(x.r.style))} · seed ${x.r.seed}`;
  bar.style.display='';
  bar.innerHTML=`<b>A/B</b><button class="btn s" data-ab="0">A · ${name(AB[0])}</button><button class="btn s" data-ab="1">B · ${name(AB[1])}</button><span class="hint">loudness matched · keeps your place</span><button class="mini" data-ab="x">✕</button>`;
  const lo=Math.min(...AB.map(x=>x.r.loudness??-10));
  bar.querySelectorAll('[data-ab]').forEach(b=>b.onclick=()=>{
    if(b.dataset.ab==='x'){ AB=[]; $$('.res').forEach(x=>x.classList.remove('ab')); bar.style.display='none'; audio.volume=1; return; }
    const x=AB[+b.dataset.ab], url=x.r.urls.mp3||x.r.urls.wav, t=(playingId&&!audio.paused)?audio.currentTime:0;
    bar.querySelectorAll('[data-ab]').forEach(y=>y.classList.toggle('p', y===b));
    audio.volume=Math.min(1, Math.pow(10,(lo-(x.r.loudness??lo))/20));
    togglePlay(x.r.id, url, x.el.querySelector('.play'), x.el.querySelector('canvas'));
    const seek=()=>{ try{ audio.currentTime=Math.min(t, (audio.duration||t)-0.1); }catch(e){} }; audio.readyState>0?seek():audio.addEventListener('loadedmetadata',seek,{once:true});
  });

function togglePlay(id,url,btn,cv){
  if(playingId===id && !audio.paused){audio.pause();btn.textContent='▶';return}
  if(playingId!==id){ $$('.play').forEach(b=>b.textContent='▶'); audio.src=url; playingId=id; audio.ontimeupdate=()=>drawWave(cv,url,audio.currentTime/audio.duration); }
  audio.play().catch(()=>{}); btn.textContent='❚❚'; audio.onended=()=>btn.textContent='▶';

const PEAKS={};
async function drawWave(cv,url,pos){
  const w=cv.width=cv.clientWidth*devicePixelRatio, h=cv.height=cv.clientHeight*devicePixelRatio, g=cv.getContext('2d');
  if(!PEAKS[url]){
    PEAKS[url]='loading';
    try{ const buf=await (await fetch(url)).arrayBuffer(); const ctx=new (window.OfflineAudioContext||window.webkitOfflineAudioContext)(1,2,44100);
      const ab=await ctx.decodeAudioData(buf); const d=ab.getChannelData(0); const n=400, step=Math.floor(d.length/n), p=[];
      for(let i=0;i<n;i++){let m=0;for(let j=i*step;j<(i+1)*step;j+=16){const v=Math.abs(d[j]);if(v>m)m=v}p.push(m)} PEAKS[url]=p; drawWave(cv,url,pos);
    }catch(e){PEAKS[url]=null} return;
  }
  if(PEAKS[url]==='loading'||!PEAKS[url]) return;
  const p=PEAKS[url], bw=w/p.length; g.clearRect(0,0,w,h);
  p.forEach((v,i)=>{ const x=i*bw, bh=Math.max(2,v*h*.92); const played=pos!=null&&i/p.length<pos;
    g.fillStyle=played?'#29d3b2':'#3a3f57'; g.fillRect(x,(h-bh)/2,Math.max(1,bw-1),bh); });
}

const PARTS=['drums','bass','chords','melody'];
function rnd(){return Math.floor(Math.random()*1e6)+1}
function setupTimeline(el, r){
  const base={}; r.sections.forEach(s=>base[s.src+':'+s.copy]=s);
  const bySrc={}; r.sections.forEach(s=>{ if(!(s.src in bySrc)) bySrc[s.src]=s; });
  let edits=(r.options.sections&&r.options.sections.length)?JSON.parse(JSON.stringify(r.options.sections)):r.sections.map(s=>({src:s.src,copy:s.copy}));
  let sel=null;
  const info=e=>base[e.src+':'+(e.copy||0)]||bySrc[e.src]||{name:'?',bars:8,layers:[]};
  const bars=e=>e.bars||info(e).bars;
  const draw=()=>{
    const tl=el.querySelector('.tl'); tl.innerHTML='';
    edits.forEach((e,i)=>{ const s=info(e); const b=document.createElement('div');
      const kind=/drop|chorus|hook|climax|theme/.test(s.name)?' drop':(/build|rise/.test(s.name)?' build':'');
      const ed=e.seeds||e.vary||e.mute&&e.mute.length||e.bars||(e.copy||0)>0;
      b.className='blk'+kind+(i===sel?' sel':'')+(ed?' edited':''); b.style.flex=bars(e); b.textContent=s.name; b.title=`${s.name} · ${bars(e)} bars — click to edit`;
      b.onclick=()=>{sel=i;draw();panel()}; tl.appendChild(b); });
  };
  const panel=()=>{
    const box=el.querySelector('.sedbox'); if(sel==null){box.innerHTML='';return}
    const e=edits[sel], s=info(e);
    box.innerHTML=`<div class="sed"><div class="row"><b>${esc(s.name)}</b><span class="hint">${bars(e)} bars · section ${sel+1} of ${edits.length}</span><span style="margin-left:auto"></span><button class="mini" data-x="close">✕</button></div>
      <div class="row"><span class="lbl hint">New take</span><button class="mini acc" data-x="all">🎲 Whole section</button>${PARTS.map(p=>`<button class="mini" data-p="${p}">${p}</button>`).join('')}<button class="mini" data-x="vary" title="Keeps the section, changes a few details">✨ Subtle variation</button></div>
      <div class="row"><span class="lbl hint">Shape</span><button class="mini" data-x="shorter">− 4 bars</button><button class="mini" data-x="longer">+ 4 bars</button><button class="mini" data-x="left">◀ move</button><button class="mini" data-x="right">move ▶</button><button class="mini" data-x="dup">⧉ duplicate</button><button class="mini" data-x="del">🗑 remove</button><button class="mini" data-x="reset">↺ reset</button></div>
      <div class="row"><span class="lbl hint">Parts here</span>${(s.layers||[]).map(l=>`<span class="chip ${(e.mute||[]).includes(l)?'':'on'}" data-m="${l}">${l}</span>`).join('')}</div>
      <div class="row"><button class="btn s" data-x="hear" style="padding:7px 12px">▶ Hear this section</button><button class="btn g" data-x="apply" style="padding:7px 12px">⬇ Full song with edits</button></div>
      <div class="sedplay"></div></div>`;
    const q=x=>box.querySelector(x);
    box.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{e.seeds=Object.assign({},e.seeds||{});e.seeds[b.dataset.p]=rnd();draw();hear()});
    box.querySelectorAll('[data-m]').forEach(c=>c.onclick=()=>{const l=c.dataset.m;e.mute=(e.mute||[]).includes(l)?e.mute.filter(x=>x!==l):[...(e.mute||[]),l];panel();draw()});
    box.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{
      const x=b.dataset.x;
      if(x==='close'){sel=null;draw();panel();return}
      if(x==='all'){e.seeds={};PARTS.forEach(p=>e.seeds[p]=rnd());draw();hear();return}
      if(x==='vary'){e.vary=rnd();draw();hear();return}
      if(x==='shorter'){e.bars=Math.max(4,bars(e)-4)} if(x==='longer'){e.bars=Math.min(64,bars(e)+4)}
      if(x==='reset'){delete e.seeds;delete e.vary;delete e.mute;delete e.bars}
      if(x==='left'&&sel>0){[edits[sel-1],edits[sel]]=[edits[sel],edits[sel-1]];sel--}
      if(x==='right'&&sel<edits.length-1){[edits[sel+1],edits[sel]]=[edits[sel],edits[sel+1]];sel++}
      if(x==='dup'){const c=Math.max(...edits.filter(y=>y.src===e.src).map(y=>y.copy||0))+1;edits.splice(sel+1,0,Object.assign(JSON.parse(JSON.stringify(e)),{copy:c}));sel++}
      if(x==='del'&&edits.length>1){edits.splice(sel,1);sel=Math.min(sel,edits.length-1)}
      if(x==='hear'){hear();return}
      if(x==='apply'){run(false,1,Object.assign({},r.options,{sections:edits}));return}
      draw();panel();
    });
    function hear(){ const o=Object.assign({},r.options,{sections:edits}); const at=sel;
      run(true,1,o,at,res=>{ const sp=el.querySelector('.sedplay'); if(!sp) return; const u=res.urls.wav||res.urls.mp3;
        sp.innerHTML=`<audio controls autoplay src="${u}"></audio><div class="hint">Section ${at+1} with a short lead-in. Happy? Press “Full song with edits”.</div>`; }); }
  };
  draw();
}

async function decodeFile(file, rate){
  const buf=await file.arrayBuffer(); const ctx=new (window.AudioContext||window.webkitAudioContext)();
  const ab=await ctx.decodeAudioData(buf); ctx.close();
  const len=Math.min(ab.duration,120); const off=new OfflineAudioContext(1,Math.ceil(len*rate),rate);
  const src=off.createBufferSource(); src.buffer=ab; src.connect(off.destination); src.start(0);
  const out=await off.startRendering(); return out.getChannelData(0);
}
async function onReference(file){
  $('#refRes').textContent='Analyzing '+file.name+'…';
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  try{
    let a;
    if(['mid','midi','kar','musicxml','xml','mxl','json'].includes(ext)){
      a=await upload('/api/upload/reffile?name='+encodeURIComponent(file.name), new Blob([await file.arrayBuffer()]));
    } else {
      const pcm=await decodeFile(file,22050); a=await upload('/api/upload/reference?sr=22050',new Blob([pcm.buffer]));
    }
    if(a.error){$('#refRes').textContent=a.error;return}
    if(a.source==='settings'){ $('#refRes').innerHTML=`Studio Lab settings: <b>${esc(styleName(a.options.style))}</b> <button class="mini acc" id="refApply">Load</button>`;
      $('#refApply').onclick=()=>{ applyOptions(a.options); $('#status').textContent='Settings loaded - press Preview.'; }; return; }
    const show=()=>{ const bits=[`<b>${a.bpm} BPM</b> <button class="mini" id="refHalf">÷2</button><button class="mini" id="refDbl">×2</button>`, `key <b>${esc(a.key)}</b>${a.scale&&!['major','minor'].includes(a.scale)?' '+esc(a.scale):''}`];
      if(a.progression) bits.push(`chords <b>${esc(a.progression)}</b>`);
      if(a.swing) bits.push(`swing <b>${Math.round(a.swing*100)}%</b>`);
      if(a.timesig&&a.timesig!=='4/4') bits.push(`<span class="hint">${esc(a.timesig)} (played in 4/4)</span>`);
      if(a.loudness!=null) bits.push(`${a.loudness} LUFS`);
      if(a.brightness!=null) bits.push(`brightness ${a.brightness>0?'+':''}${a.brightness}`);
      $('#refRes').innerHTML=bits.join(' · ')+' <button class="mini acc" id="refApply">Apply</button>';
      $('#refHalf').onclick=()=>{a.bpm=Math.max(40,Math.round(a.bpm/2));show()}; $('#refDbl').onclick=()=>{a.bpm=Math.min(200,a.bpm*2);show()};
      $('#refApply').onclick=()=>{ $('#bpmAuto').checked=false; $('#bpm').value=a.bpm; $('#key').value=a.key;
        if(a.scale && [...$('#scale').options].some(o=>o.value===a.scale)) $('#scale').value=a.scale;
        if(a.progression) $('#prog').value=a.progression;
        if(a.swing){ $('#swingAuto').checked=false; $('#swing').value=Math.round(a.swing*100); }
        if(a.loudness!=null){ $('#loudAuto').checked=false; $('#loud').value=a.loudness; }
        if(a.brightness!=null) $('#brightness').value=Math.round(a.brightness*100);
        if(a.energy!=null) $('#energy').value=Math.round(a.energy*100);
        if(a.complexity!=null) $('#complexity').value=Math.round(a.complexity*100);
        syncAutos(); $$('input[type=range]').forEach(e=>e.oninput&&e.oninput());
        $('#status').textContent='Reference applied'+(a.progression?' (including its chord progression)':'')+' - press Preview.'; };
    };
    show();
  }catch(e){ $('#refRes').textContent='Could not read that file ('+e.message+')'; }

const ORCH_SECTIONS=[['strings legato','long string pads and melodies'],['strings spiccato','short, driving ostinatos'],

  const plugs=V.plugins.filter(p=>!p.is_effect);

  const draw=()=>{
    const i=+($('#oPlug')?$('#oPlug').value:Math.max(0,guess)); const p=plugs[i]; const pre=$('#oPre')?$('#oPre').value:(p?prefixOf(p):'');

        <div class="row">${h?`<button class="mini" data-otst="${esc(h.id)}">▶</button>`:''}<button class="mini ${h?'':'acc'}" data-osec="${k}">${h?'Redo…':'Set up…'}</button></div></div>`; }).join('');

        if(r.ok){ V=await api('/api/vst',{}); META=await api('/api/meta'); $('#oMsg').textContent='Saved “'+nm+'”. Next section?'; draw(); }
        else $('#oMsg').textContent='Could not save: '+(r.error||j.error||'unknown error'); })); });

    <p class="hint">Pick your orchestra plugin, then click <b>Set up…</b> on each section you have: the plugin opens, you load that section (e.g. <i>Violins 1 → Spiccato</i>) and close the window.
      Studio Lab saves it with the right name, so strings, celli, horns and woodwinds in <b>every genre</b> play through your plugin - long notes get legato, fast patterns spiccato, plucked parts pizzicato,
      and the mod wheel (CC1) shapes each phrase's dynamics. Skip any sections your plugin doesn't have.</p>
    ${plugs.length?`<div class="row"><label>Plugin <select id="oPlug">${plugs.map((p,i)=>`<option value="${i}" ${i===Math.max(0,guess)?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label>
      <label style="margin-left:10px">Name prefix <input type="text" id="oPre" style="width:90px"></label></div>`:'<div class="hint">No instrument plugins found - install your orchestra plugin first, then rescan.</div>'}
    <div id="oMsg" class="hint" style="margin:8px 0"></div><div id="oRows"></div><div id="oPlay"></div>
    <div style="text-align:right;margin-top:14px"><button class="btn" id="oBack">← VST sounds</button> <button class="btn p" onclick="closeModal()">Done</button></div>`;
  if(plugs.length){ $('#oPre').value=prefixOf(plugs[Math.max(0,guess)]); $('#oPlug').onchange=()=>{ $('#oPre').value=prefixOf(plugs[+$('#oPlug').value]); draw(); }; $('#oPre').oninput=draw; draw(); }

      <div class="m">${p.cats.map(c=>CATNAMES[c]||c).join(' · ')} — ${p.formats.join('/').toUpperCase()}</div></div>
     <div style="text-align:right">${Object.entries(p.works).map(([d,ok])=>`<span class="tag ${ok?'ok':'no'}">${d==='lmms'?'LMMS':'Waveform'} ${ok?'✓':'✗'}</span>`).join('')}
      <div style="margin-top:4px"><a href="${p.url}" target="_blank" rel="noopener" style="font-size:12px">Get it ↗</a></div></div></label>`;
  const byInst=(a,b)=>(b.installed-a.installed);
  const inst=PLUG.catalog.filter(p=>!isFx(p)).sort(byInst), effs=PLUG.catalog.filter(isFx).sort(byInst);
  $('#modalBox').className='box wide';
  $('#modalBox').innerHTML=`<h3>My plugins</h3>
    <div class="row" style="flex-wrap:wrap;gap:14px;margin-bottom:10px">
      <div><div class="hint">My DAWs</div><div class="chips" id="pdaws">${['lmms','waveform'].map(d=>`<span class="chip ${PLUG.daws.includes(d)?'on':''}" data-d="${d}">${d==='lmms'?'LMMS':'Waveform Free'}</span>`).join('')}</div></div>
      <div><div class="hint">My computer</div><select id="pos" style="width:auto">${['windows','mac','linux'].map(o=>`<option value="${o}" ${PLUG.os===o?'selected':''}>${o[0].toUpperCase()+o.slice(1)}${o===PLUG.host_os?' (this PC)':''}</option>`).join('')}</select></div>
      <div style="margin-left:auto"><button class="btn s" id="pscan">⟳ Rescan</button></div>
    </div>
    <div class="hint" style="margin-bottom:8px">Studio Lab finds the plugins installed on this computer by itself (✓) and uses them: matching parts play through them, and every full song comes with a guide saying which plugin to load on each part — only ones your DAWs can open.
      <br>LMMS loads <b>VST2</b> plugins on Windows/Linux and <b>SF2</b> soundfonts everywhere (no VST3, no VST on Mac). Waveform loads VST, VST3 and AU (Mac).</div>
    <div id="pscanres" class="hint"></div>
    <h3 style="margin-top:12px">Instruments</h3>${inst.map(row).join('')}
    <h3 style="margin-top:16px">Mixing &amp; effects</h3>${effs.map(row).join('')}
    ${PLUG.other&&PLUG.other.length?`<h3 style="margin-top:16px">Other plugins found on this computer</h3><div class="hint">${PLUG.other.map(esc).join(' · ')}</div>`:''}
    <div style="text-align:right;margin-top:14px"><button class="btn p" onclick="closeModal()">Done</button></div>`;
  const save=async()=>{ const daws=$$('#pdaws .chip.on').map(x=>x.dataset.d);
    return await api('/api/plugins',{daws:daws.length?daws:['lmms','waveform'],os:$('#pos').value}); };
  $$('#pdaws .chip').forEach(c=>c.onclick=async()=>{c.classList.toggle('on'); plugModal(await save());});
  $('#pos').onchange=async()=>plugModal(await save());
  $('#pscan').onclick=async()=>{ $('#pscan').disabled=true; $('#pscan').textContent='Scanning…'; const r=await api('/api/plugins/scan',{});
    await plugModal(r); $('#pscanres').innerHTML=`Scanned ${r.scan.dirs.length} folder(s): found <b>${r.scan.found}</b> known plugins, ${r.scan.other} others listed below.`; };
  $('#modal').classList.add('on');
}
function closeModal(){$('#modal').classList.remove('on');$('#modalBox').className='box'}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
async function updates(manual){
  const u=await api('/api/update/check',{});
  if(u.available){$('#updBadge').style.display='';}
  if(!manual) return;
  $('#modalBox').innerHTML=`<h3>Updates</h3><p>Installed: <b>${u.current}</b>${u.latest?` · Latest: <b>${u.latest}</b>`:''}</p>
    ${u.error?`<p class="hint">${esc(u.error)}</p>`:''}${u.available?`<pre>${(u.notes||'').replace(/</g,'&lt;')}</pre><button class="btn p" id="doUpd">Update now</button>`:(!u.error?'<p>You have the latest version.</p>':'')}
    <div style="text-align:right;margin-top:12px"><button class="btn s" onclick="closeModal()">Close</button></div>`;
  if(u.available) $('#doUpd').onclick=async()=>{ $('#doUpd').disabled=true; $('#doUpd').textContent='Updating…'; const r=await api('/api/update/apply',{});
    $('#modalBox').innerHTML=`<p>${r.message}</p><p class="hint">The app restarts by itself — this page reloads in a few seconds.</p>`; if(r.ok) setTimeout(()=>location.reload(),5000); };
  $('#modal').classList.add('on');
}
function renderTabs(){
  const t=$('#catTabs');t.innerHTML='';
  Object.keys(META.categories).forEach(c=>{const b=document.createElement('button');const n=META.categories[c].filter(s=>inMix(s.id)).length;b.innerHTML=c+(n?`<span class="cnt">${n}</span>`:'');if(c===state.cat)b.className='on';b.onclick=()=>{state.cat=c;$('#search').value='';renderTabs();renderStyles()};t.appendChild(b)});
}
function initSegs(){
  seg($('#length'),[[0.5,'Short'],[1,'Normal'],[1.5,'Long'],[2,'Extended']],()=>state.length,v=>state.length=v);
  seg($('#structure'),[['auto','Auto'],['radio','Radio'],['club','Club'],['loop','Loop']],()=>state.structure,v=>state.structure=v);
  seg($('#lofi'),[[null,'Style'],[true,'On'],[false,'Off']],()=>state.lofi,v=>state.lofi=v);
}
async function init(){
  META=await api('/api/meta');
  $('#ver').textContent='v'+META.version;
  $('#key').innerHTML='<option value="">Auto</option>'+META.keys.map(k=>`<option>${k}</option><option value="${k}m">${k}m</option>`).join('');
  $('#scale').innerHTML='<option value="">Auto</option>'+META.scales.map(s=>`<option value="${s}">${s.replace('_',' ')}</option>`).join('');
  $('#kit').innerHTML='<option value="">Style default</option>'+META.kits.filter(k=>k!=='default').map(k=>`<option>${k}</option>`).join('');
  const NICE={diatonic:'Diatonic (scale)',pentatonic:'Pentatonic',blues:'Blues (blue notes, slides)',bebop:'Bebop (chromatic approaches)',
    close:'Close',open:'Open / spread',drop2:'Drop-2 (soul, house)',rootless:'Rootless (jazz piano)',power:'Power chords',
    triad:'Triads','7':'7ths',add9:'add9','9':'9ths','6':'6ths',sus2:'sus2',sus4:'sus4'};
  const fill=(id,list,def)=>$(id).innerHTML=`<option value="">${def}</option>`+list.map(x=>`<option value="${x}">${NICE[x]||x}</option>`).join('');
  fill('#melStyle',META.melody_styles,'Genre default'); fill('#voicing',META.voicings,'Genre default'); fill('#chordColor',META.chord_colors,'Varies per song');
  $('#levels').innerHTML=LEVELS.map(([k,n])=>`<label class="lv">${n} <b id="lvV_${k}">0</b><input type="range" id="lv_${k}" min="-12" max="6" step="1" value="0"></label>`).join('');
  LEVELS.forEach(([k])=>{ const e=$('#lv_'+k); e.oninput=()=>$('#lvV_'+k).textContent=(e.value>0?'+':'')+e.value; });
  initKnobs();
  $('#lvReset').onclick=e=>{ e.preventDefault(); LEVELS.forEach(([k])=>{ $('#lv_'+k).value=0; $('#lv_'+k).oninput(); }); };
  $('#seed').value=Math.floor(Math.random()*99999)+1;
  initSegs(); renderTabs(); renderMoods(); renderLayers(); renderOuts(); refresh();
  bindRange('simplicity',v=>v<5?'off':v<40?v+'% · lighter':v<75?v+'% · simple':v+'% · bare');
  bindRange('repetition',v=>v<35?v+'% · developing':v<65?v+'%':v+'% · catchy loop');
  bindRange('mrange',v=>v<35?'narrow':v<65?'normal':'wide');
  bindRange('energy',v=>v+'%'); bindRange('complexity',v=>v+'%'); bindRange('humanize',v=>v+'%'); bindRange('variety',v=>v<20?v+'% · faithful':v<60?v+'% · balanced':v+'% · adventurous'); bindRange('brightness',v=>(v>0?'+':'')+v);
  bindRange('reverb',v=>v+'%'); bindRange('delay',v=>v+'%'); bindRange('width',v=>v+'%'); bindRange('bass',v=>(v>0?'+':'')+v+' dB'); bindRange('drive',v=>v+'%');
  $('#bpm').oninput=syncAutos; ['bpmAuto','swingAuto','scAuto','loudAuto'].forEach(a=>$('#'+a).onchange=syncAutos);
  $('#search').oninput=renderStyles;
  $('#dice').onclick=()=>$('#seed').value=Math.floor(Math.random()*999999)+1;
  // pressing a generate button again makes a new song; Full song right after a preview renders that preview's song
  let lastRun=null;
  const freshSeed=(preview)=>{ const cur=+$('#seed').value||1;
    if(!$('#seedLock').checked && lastRun && lastRun.seed===cur && (preview || !lastRun.preview)) $('#seed').value=Math.floor(Math.random()*999999)+1;
    lastRun={seed:+$('#seed').value||1, preview}; };
  $('#prevBtn').onclick=()=>{ freshSeed(true); run(true,1); };
  $('#varBtn').onclick=()=>{ freshSeed(true); run(true,4); if(!$('#seedLock').checked) lastRun.seed=(+$('#seed').value||1); };
  $('#fullBtn').onclick=()=>{ freshSeed(false); run(false,1); };
  $('#surpriseBtn').onclick=()=>{
    const all=Object.values(META.categories).flat().map(s=>s.id), pick=a=>a[Math.floor(Math.random()*a.length)];
    const wpick=(a,w)=>{const ws=a.map(x=>Math.max(0.2,1+(w&&w[x]||0)));let t=Math.random()*ws.reduce((p,c)=>p+c,0);for(let i=0;i<a.length;i++){t-=ws[i];if(t<=0)return a[i]}return a[a.length-1]};
    state.style=wpick(all,TASTE&&TASTE.styles); state.blend=Math.random()<.55?[pick(all.filter(x=>x!==state.style))]:[]; $('#variety').value=40+Math.random()*50; state.blend_parts={}; state.instruments={};
    state.mood=Math.random()<.7?wpick(META.moods,TASTE&&TASTE.moods):null;
    const te=TASTE&&TASTE.energy!=null?TASTE.energy*100:60, tc=TASTE&&TASTE.complexity!=null?TASTE.complexity*100:50;
    $('#energy').value=Math.max(5,Math.min(95,te+(Math.random()-.5)*40)); $('#complexity').value=Math.max(5,Math.min(95,tc+(Math.random()-.5)*40));
    $('#seed').value=Math.floor(Math.random()*999999)+1;
    const cat=Object.entries(META.categories).find(([c,l])=>l.some(s=>s.id===state.style)); state.cat=cat[0];
    const il=(TASTE&&TASTE.inst_likes)||{};                          // instruments you liked, per part
    Object.entries(il).forEach(([role,w])=>{ const ok=Object.keys(w).filter(i=>(META.roles[role]||[]).some(x=>x.id===i)); if(ok.length&&Math.random()<.35) state.instruments[role]=wpick(ok,w); });
    renderTabs(); renderMoods(); refresh(); $$('input[type=range]').forEach(e=>e.oninput&&e.oninput());
    const o=options(); const pl=((TASTE&&TASTE.part_likes)||{})[state.style]||{};   // a part you loved in this style
    Object.entries(pl).forEach(([p,seeds])=>{ const sd=seeds.filter(x=>x!=null); if(sd.length&&Math.random()<.5){ o.part_seeds=Object.assign({},o.part_seeds||{}); o.part_seeds[p]=pick(sd); } });
    run(true,1,o);
  };
  $('#folderBtn').onclick=()=>api('/api/open',{});
  $('#presetBtn').onclick=presetsModal;
  $('#plugBtn').onclick=()=>plugModal();
  $('#soundsBtn').onclick=()=>soundsModal();
  $('#vstBtn').onclick=()=>vstModal();
  $('#rigBtn').onclick=()=>rigModal();
  (function watchPlugins(){ let seen=false;
    const t=async()=>{ let st; try{ st=await api('/api/vststatus',{}); }catch(e){ return; }
      if(st.running){ seen=true; if(!busy) $('#status').textContent=`Checking your plugins ${st.done+1}/${st.total}: ${st.current}…`; setTimeout(t,1500); }
      else if(seen){ META=await api('/api/meta'); renderSelected(); if(!busy) $('#status').textContent='Plugins checked - your instruments and effects are in the Sound menus.'; }
      else if(Date.now()-T0<20000) setTimeout(t,2500); };
    const T0=Date.now(); setTimeout(t,1200); })();

  $('#libBtn').onclick=()=>libModal();
  api('/api/soundlib',{}).then(r=>{ if(r.installed) $('#libBtn').textContent='🎻 Real instruments ✓'; });
  $('#refBtn').onclick=()=>$('#refFile').click();
  $('#refFile').onchange=()=>{const f=$('#refFile').files[0]; if(f) onReference(f)};
  api('/api/taste',{}).then(t=>TASTE=t);
  $('#updBtn').onclick=()=>updates(true);
  $$('.rtabs button').forEach(b=>b.onclick=()=>{$$('.rtabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('#session').style.display=b.dataset.t==='session'?'':'none';$('#library').style.display=b.dataset.t==='library'?'':'none';if(b.dataset.t==='library')loadLibrary()});
  document.addEventListener('keydown',e=>{ if(e.code==='Space'&&!['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)){e.preventDefault(); audio.paused?audio.play():audio.pause();} });
  syncAutos(); updates(false);
}
init();
document.addEventListener('click',async e=>{ const a=e.target.closest&&e.target.closest('.orchGo'); if(!a) return; e.preventDefault();
  const V=await api('/api/vst',{}); if(!V.available){ vstModal(); return } orchModal(V); });
</script>
</body>
</html>

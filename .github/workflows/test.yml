name: test
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install flake8
      # real errors only: undefined names, unused imports / variables, syntax problems
      - run: flake8 --select=F --max-line-length=200 sgcore studiolab.py tests tools

  oldest-python:
    # the README promises Python 3.9+: everything must at least import and the fast tests pass there
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # newer runner images no longer ship Python 3.9 for setup-python; uv still provides it
      - run: pip install uv && uv venv -p 3.9 .py39 && uv pip install -p .py39/bin/python -r requirements.txt
      - run: .py39/bin/python --version && .py39/bin/python -m compileall -q sgcore studiolab.py tests tools
      - run: .py39/bin/python -m tests.appmisc
      - run: .py39/bin/python -m tests.features
      - run: .py39/bin/python -m tests.smoke --shard 1/8

  quick:
    # (2.30) the few-minute checks run first: the 16 long jobs below only start once these pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q sgcore studiolab.py tests tools
      - run: python -m tests.appmisc
      - run: python -m tests.quick

  tests:
    needs: quick
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # (2.21) the smoke render is the slow part (~22-28 min as 3 shards): 8 parallel shards finish in ~8-10 min
        suite: ['smoke --shard 1/8', 'smoke --shard 2/8', 'smoke --shard 3/8', 'smoke --shard 4/8',
                'smoke --shard 5/8', 'smoke --shard 6/8', 'smoke --shard 7/8', 'smoke --shard 8/8', 'genres', 'features',
                'vstpacks', 'samplelibs', 'appmisc', 'mixcheck', 'dsp_checks', 'allgenres']
    name: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m tests.${{ matrix.suite }}

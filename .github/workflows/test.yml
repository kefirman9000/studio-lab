name: test
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m tests.smoke
      - run: python -m tests.vstpacks
      - run: python -m tests.samplelibs
      - run: python -m tests.appmisc
      - run: python -m tests.genres

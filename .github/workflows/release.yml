name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build zip
        run: |
          VER="${GITHUB_REF_NAME#v}"
          git archive --format=zip --prefix=studio-lab/ -o "studio-lab-${VER}.zip" HEAD
      - name: Release notes from CHANGELOG
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v v="## ${VER}" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          {
            echo ""
            echo "**Install:** download \`studio-lab-${VER}.zip\` below, unzip it, then double-click \`Start Studio Lab (Windows).bat\` or \`Start Studio Lab (Mac).command\` (Python 3.9+ required)."
            echo "Already installed? Click **⟳ Updates** inside the app."
          } >> notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "studio-lab-${VER}.zip" --title "Studio Lab ${VER}" --notes-file notes.md

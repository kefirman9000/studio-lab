name: release
# (2.17) A version is published only after the whole test run on that exact commit passed - the app updates from
# these releases (not from the branch), so a commit whose tests fail never reaches anyone.
on:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      ver: ${{ steps.v.outputs.ver }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Read version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="$(tr -d '[:space:]' < VERSION)"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          if gh release view "v$VER" >/dev/null 2>&1; then echo "exists=1" >> "$GITHUB_OUTPUT"; else echo "exists=0" >> "$GITHUB_OUTPUT"; fi
      - name: Build zip
        if: steps.v.outputs.exists == '0'
        run: |
          VER="${{ steps.v.outputs.ver }}"
          git archive --format=zip --prefix=studio-lab/ -o "studio-lab-${VER}.zip" HEAD
          sha256sum "studio-lab-${VER}.zip" | cut -d' ' -f1 > "studio-lab-${VER}.zip.sha256"
      - name: Release notes from CHANGELOG
        if: steps.v.outputs.exists == '0'
        run: |
          VER="${{ steps.v.outputs.ver }}"
          awk -v v="## ${VER}" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          {
            echo ""
            echo "**Install (easy - nothing else needed):** download the installer for your computer below (it appears a few minutes after this release):"
            echo "- **Windows:** \`StudioLab-Setup-${VER}.exe\` - double-click it and follow the steps."
            echo ""
            echo "Or, if you already have Python 3.9+: download \`studio-lab-${VER}.zip\`, unzip it, and double-click \`Start Studio Lab (Windows).bat\` or \`Start Studio Lab (Mac).command\`."
            echo "Already installed? Click **⟳ Updates** inside the app."
          } >> notes.md
      - name: Publish
        if: steps.v.outputs.exists == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ steps.v.outputs.ver }}"
          gh release create "v${VER}" "studio-lab-${VER}.zip" "studio-lab-${VER}.zip.sha256" "Update Studio Lab.bat" --target "$(git rev-parse HEAD)" --title "Studio Lab ${VER}" --notes-file notes.md

  installers:
    needs: release
    if: needs.release.outputs.exists == '0'
    uses: ./.github/workflows/installers.yml
    with:
      tag: v${{ needs.release.outputs.ver }}

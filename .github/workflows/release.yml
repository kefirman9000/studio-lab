name: release
on:
  push:
    branches: [main]
    paths: ['VERSION', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      ver: ${{ steps.v.outputs.ver }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="$(tr -d '[:space:]' < VERSION)"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          if gh release view "v$VER" >/dev/null 2>&1; then echo "exists=1" >> "$GITHUB_OUTPUT"; else echo "exists=0" >> "$GITHUB_OUTPUT"; fi
      - name: Build zip
        if: steps.v.outputs.exists == '0'
        run: |
          VER="${{ steps.v.outputs.ver }}"
          git archive --format=zip --prefix=studio-lab/ -o "studio-lab-${VER}.zip" HEAD
      - name: Release notes from CHANGELOG
        if: steps.v.outputs.exists == '0'
        run: |
          VER="${{ steps.v.outputs.ver }}"
          awk -v v="## ${VER}" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          {
            echo ""
            echo "**Install (easy - nothing else needed):** download the installer for your computer below (it appears a few minutes after this release):"
            echo "- **Windows:** \`StudioLab-Setup-${VER}.exe\` - double-click it and follow the steps."
            echo "- **Mac:** \`StudioLab-${VER}-Mac-AppleSilicon.dmg\` (M1/M2/M3/M4 Macs) or \`-Mac-Intel.dmg\` (older Macs) - open it and drag Studio Lab into Applications."
            echo ""
            echo "Or, if you already have Python 3.9+: download \`studio-lab-${VER}.zip\`, unzip it, and double-click \`Start Studio Lab (Windows).bat\` or \`Start Studio Lab (Mac).command\`."
            echo "Already installed? Click **⟳ Updates** inside the app."
          } >> notes.md
      - name: Publish
        if: steps.v.outputs.exists == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ steps.v.outputs.ver }}"
          gh release create "v${VER}" "studio-lab-${VER}.zip" "Update Studio Lab.bat" --target "$GITHUB_SHA" --title "Studio Lab ${VER}" --notes-file notes.md

  installers:
    needs: release
    if: needs.release.outputs.exists == '0'
    uses: ./.github/workflows/installers.yml
    with:
      tag: v${{ needs.release.outputs.ver }}

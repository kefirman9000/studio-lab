name: release
on:
  push:
    branches: [main]
    paths: ['VERSION', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="$(tr -d '[:space:]' < VERSION)"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          if gh release view "v$VER" >/dev/null 2>&1; then echo "exists=1" >> "$GITHUB_OUTPUT"; else echo "exists=0" >> "$GITHUB_OUTPUT"; fi
      - name: Build zip
        if: steps.v.outputs.exists == '0'
        run: |
          VER="${{ steps.v.outputs.ver }}"
          git archive --format=zip --prefix=studio-lab/ -o "studio-lab-${VER}.zip" HEAD
      - name: Release notes from CHANGELOG
        if: steps.v.outputs.exists == '0'
        run: |
          VER="${{ steps.v.outputs.ver }}"
          awk -v v="## ${VER}" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          {
            echo ""
            echo "**Install:** download \`studio-lab-${VER}.zip\` below, unzip it, then double-click \`Start Studio Lab (Windows).bat\` or \`Start Studio Lab (Mac).command\` (Python 3.9+ required)."
            echo "Already installed? Click **⟳ Updates** inside the app."
          } >> notes.md
      - name: Publish
        if: steps.v.outputs.exists == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ steps.v.outputs.ver }}"
          gh release create "v${VER}" "studio-lab-${VER}.zip" --target "$GITHUB_SHA" --title "Studio Lab ${VER}" --notes-file notes.md

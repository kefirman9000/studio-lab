name: probe
on:
  push:
    branches: [probe-packs]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt pedalboard mido
      - run: python tools/probe_packs.py probe_out
      - run: python tools/probe_plugins.py probe_out ${{ vars.PROBE_IDS || '' }} || true
      - name: Commit the results to this branch
        run: |
          mkdir -p probe_results && cp probe_out/*.json probe_results/
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git add probe_results && git commit -qm "probe results [skip ci]" && git push -q origin HEAD:probe-packs
